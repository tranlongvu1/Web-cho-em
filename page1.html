<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hộp quà dành cho Em 🎁</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="page1">

    <main class="scene">

        <div class="gift-area">

            <div class="eyebrow">
                ✨ MỘT MÓN QUÀ NHỎ DÀNH CHO EM ✨
            </div>

            <div
                class="gift"
                id="gift"
                aria-label="Bấm để mở hộp quà"
            >

                <div class="letter">
                    <h2>Gửi Em 💗</h2>

                    <p>
                        Một chút bất ngờ nhỏ dành cho người đặc biệt.
                        Mở ra nhé...
                    </p>
                </div>

                <div class="lid"></div>

                <div class="bow">
                    🎀
                </div>

                <div class="ribbon-v"></div>

                <div class="box-body"></div>

            </div>

            <div class="open-text" id="openText">
                🎁 Bấm vào hộp quà để mở
            </div>

            <section class="after" id="after">

                <h1>
                    🎂 Chúc mừng
                    <span>sinh nhật Em!</span>
                </h1>

                <a class="next" href="page2.html">
                    Mở bất ngờ tiếp theo 💌 →
                </a>

            </section>

        </div>

    </main>

    <audio id="music" loop>
        <source src="happy-birthday.mp3" type="audio/mpeg">
    </audio>

    <script>
        const gift = document.getElementById("gift");
        const after = document.getElementById("after");
        const openText = document.getElementById("openText");
        const music = document.getElementById("music");

        gift.addEventListener("click", () => {

            if (!gift.classList.contains("open")) {

                gift.classList.add("open");

                openText.textContent =
                    "💖 Món quà dành riêng cho Em";

                setTimeout(() => {
                    after.classList.add("show");
                }, 900);

                music.play().catch(() => {});
            }

        });

        function heart() {

            const heart = document.createElement("div");

            heart.className = "heart-rain";

            heart.textContent =
                Math.random() > 0.5 ? "♥" : "♡";

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.fontSize =
                12 + Math.random() * 18 + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(heart, 500);
    </script>

</body>
</html>
