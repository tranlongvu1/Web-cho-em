<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinh cầu - Cho em</title>
  <link rel="stylesheet" href="page6.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js",
      "three/examples/jsm/loaders/FontLoader.js": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/FontLoader.js",
      "three/examples/jsm/geometries/TextGeometry.js": "https://unpkg.com/three@0.152.2/examples/jsm/geometries/TextGeometry.js"
    }
  }
  </script>
</head>
<body>
  <div id="container"></div>

  <div id="landscape-warning">
    <div class="warning-content">
      <div class="rotate-icon"></div>
      <h1>Love</h1>
      <h1>Tinh Cầu</h1>
      <p style="font-size:0.6em;">Em hãy xoay ngang màn hình nha để thấy điều kỳ diệu!</p>
      <p style="font-size:0.6em;">Nhớ chạm vào tinh cầu ở giữa để mở quà bí mật nha.</p>
      <div class="stars-bg"></div>
    </div>
  </div>

  <div id="dark-overlay"></div>
  <div id="info"></div>

  <section id="end-panel" aria-live="polite">
    <button id="close-end" aria-label="Đóng lời kết">×</button>
    <h2>🌌 Một góc nhỏ dành cho em</h2>
    <p>Tinh cầu và những bức ảnh vẫn ở đây. Em có thể đóng lời nhắn này để tiếp tục xoay, ngắm tinh cầu và xem ảnh nhé. 💗</p>
  </section>
  <button id="reopen-end" type="button">💌 Mở lời kết</button>
  <button id="exit-page6" type="button">x</button>
  <div id="landscape-warning"></div>
  <script>
    window.dataLove2Loveloom = {
      template: "Ngọc Hân",
      data: {
        keychain: { name: "Ngọc Hân", phone: "Ngọc Hân", address: "Ngọc Hân" },
        ringTexts: ["Ngọc Hân"]
      }
    };
  </script>
  <script type="module" src="page6.js"></script>
</body>
</html>
