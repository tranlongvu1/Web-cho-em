<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Những khoảnh khắc 📸</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body class="page4">

    <main class="gallery-wrap">

        <header class="gallery-title">

            <small>
                OUR LITTLE MEMORIES
            </small>

            <h1>
                Khoảnh khắc
            </h1>

            <p>
                Mỗi tấm ảnh là một chút dễ thương được giữ lại. 🤍
            </p>

        </header>

        <div class="photo-stack" id="photoStack">

            <img src="Anhcuaem/anh3.jpg" alt="Ảnh 1">

            <img src="Anhcuaem/anh10.jpg" alt="Ảnh 2">

            <img src="Anhcuaem/anh8.jpg" alt="Ảnh 3">

            <img src="Anhcuaem/anh2.jpg" alt="Ảnh 4">

            <img src="Anhcuaem/anh9.jpg" alt="Ảnh 5">

            <img src="Anhcuaem/anh1.jpg" alt="Ảnh 6">

        </div>

        <p class="gallery-hint">
            💕 Bấm vào chồng ảnh để mở album
        </p>

        <div class="memory-next">

            <a href="page5.html">
                Đi đến bất ngờ cuối cùng 🎁 →
            </a>

        </div>

    </main>

    <div class="modal" id="modal">

        <span class="close" id="close">
            ×
        </span>

        <img id="large" alt="Ảnh kỷ niệm">

    </div>

    <script>
        const s = document.getElementById('photoStack');
        const modal = document.getElementById('modal');
        const large = document.getElementById('large');

        s.addEventListener('click', e => {

            if (!s.classList.contains('open')) {
                s.classList.add('open');
                return;
            }

            if (e.target.tagName === 'IMG') {
                large.src = e.target.src;
                modal.classList.add('show');
            }

        });

        document.getElementById('close').onclick = () => {
            modal.classList.remove('show');
        };

        modal.onclick = e => {

            if (e.target === modal) {
                modal.classList.remove('show');
            }

        };

        document.addEventListener('keydown', e => {

            if (e.key === 'Escape') {
                modal.classList.remove('show');
            }

        });
    </script>

</body>

</html>
